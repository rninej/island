<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>The Backrooms • Mobile</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    
    body {
      overflow: hidden;
      background: #1a1a1a;
      font-family: 'Courier New', monospace;
      touch-action: none;
      position: fixed;
      width: 100%;
      height: 100%;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.8) 100%);
      pointer-events: none;
      z-index: 5;
    }

    #hud {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #ffdd88;
      background: rgba(20, 20, 20, 0.85);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      letter-spacing: 0.5px;
      z-index: 10;
      pointer-events: none;
      white-space: nowrap;
      border: 1px solid rgba(255,215,0,0.3);
    }

    /* Full-screen tap overlay shown before game starts */
    #tapOverlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.55);
      cursor: pointer;
    }
    #tapOverlay span {
      color: #ffdd88;
      font-family: 'Courier New', monospace;
      font-size: 18px;
      letter-spacing: 1px;
      border: 1px solid rgba(255,215,0,0.4);
      padding: 16px 28px;
      border-radius: 24px;
      background: rgba(20,20,20,0.85);
      text-align: center;
      pointer-events: none;
    }

    #joystickArea {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 50%;
      height: 100%;
      z-index: 15;
      pointer-events: none;
    }

    #joystickBase {
      position: absolute;
      bottom: 40px;
      left: 40px;
      width: 100px;
      height: 100px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      display: none;
      pointer-events: auto;
    }

    #joystickThumb {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      pointer-events: none;
    }

    #lookArea {
      position: fixed;
      top: 0;
      right: 0;
      width: 50%;
      height: 100%;
      z-index: 15;
      pointer-events: auto;
    }

    @media (max-width: 1024px), (max-height: 600px) {
      #joystickBase {
        display: block;
      }
      #hud {
        font-size: 10px;
        padding: 6px 12px;
        bottom: 10px;
      }
    }
  </style>
</head>
<body>
  <div id="vignette"></div>
  <div id="hud">📱 TAP ANYWHERE TO ENTER FULLSCREEN &amp; PLAY</div>

  <!-- Tap overlay: shown first; handles fullscreen + hides itself -->
  <div id="tapOverlay">
    <span>📱 TAP TO ENTER<br>THE BACKROOMS</span>
  </div>

  <div id="joystickArea">
    <div id="joystickBase">
      <div id="joystickThumb"></div>
    </div>
  </div>
  
  <div id="lookArea"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.157.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ---------- FULLSCREEN HANDLER ----------
    // Must be triggered directly from a user gesture (touch/click) on mobile.
    const tapOverlay = document.getElementById('tapOverlay');
    const hud = document.getElementById('hud');

    function tryFullscreen() {
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
      if (req) {
        req.call(el).catch(() => {}); // silently fail if browser blocks it
      }
    }

    tapOverlay.addEventListener('click', () => {
      tryFullscreen();
      tapOverlay.style.display = 'none';
      hud.innerHTML = '📱 LEFT = MOVE &nbsp;•&nbsp; RIGHT = LOOK';
    });

    // Also handle actual fullscreen request on desktop click of canvas
    // (pointer lock handled separately below)

    // ---------- SCENE ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2a2a2a);
    scene.fog = new THREE.Fog(0x2a2a2a, 12, 45);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 70);
    camera.position.set(0, 1.6, 0);

    const renderer = new THREE.WebGLRenderer({ 
      antialias: false,
      powerPreference: "high-performance",
      precision: "mediump"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.domElement.id = 'gameCanvas';
    document.body.appendChild(renderer.domElement);

    // Simple lighting
    const ambientLight = new THREE.AmbientLight(0xfff5e6, 1.0);
    scene.add(ambientLight);

    // ---------- MATERIALS ----------
    const wallMat = new THREE.MeshLambertMaterial({ color: 0xd4a853 });
    const floorMat = new THREE.MeshLambertMaterial({ color: 0xc4956a });
    const ceilingMat = new THREE.MeshLambertMaterial({ color: 0xe8d5a3 });
    const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });

    // ---------- CONSTANTS ----------
    const WALL_HEIGHT = 3.0;
    const CELL_SIZE = 4.0;
    const RENDER_DISTANCE = 24;
    const UNLOAD_DISTANCE = 32;
    const PLAYER_RADIUS = 0.4; // collision radius
    
    // Geometries
    const wallGeo = new THREE.BoxGeometry(CELL_SIZE, WALL_HEIGHT, CELL_SIZE);
    const floorGeo = new THREE.PlaneGeometry(CELL_SIZE, CELL_SIZE);
    const lightGeo = new THREE.BoxGeometry(1.0, 0.05, 0.2);

    // Object pools
    const wallPool = [];
    const floorCeilingPool = [];
    const lightPool = [];
    
    const activeObjects = new Map();
    const allLights = [];

    // ---------- POOLING ----------
    function getWall() {
      if (wallPool.length) return wallPool.pop();
      const m = new THREE.Mesh(wallGeo, wallMat);
      scene.add(m);
      return m;
    }

    function getFloorCeiling(isCeiling = false) {
      if (floorCeilingPool.length) {
        const m = floorCeilingPool.pop();
        m.rotation.x = isCeiling ? Math.PI / 2 : -Math.PI / 2;
        return m;
      }
      const m = new THREE.Mesh(floorGeo, isCeiling ? ceilingMat : floorMat);
      m.rotation.x = isCeiling ? Math.PI / 2 : -Math.PI / 2;
      scene.add(m);
      return m;
    }

    function getLight() {
      if (lightPool.length) return lightPool.pop();
      const m = new THREE.Mesh(lightGeo, lightMat);
      scene.add(m);
      return m;
    }

    function returnObj(pool, obj) {
      if (obj) {
        obj.visible = false;
        pool.push(obj);
      }
    }

    // ---------- MAZE LOGIC ----------
    function isWallAt(cx, cz) {
      if (cx % 2 === 0 && cz % 2 === 0) return true;
      if (cx % 2 === 0 || cz % 2 === 0) {
        return (Math.abs((cx * 374761393 + cz * 668265263) ^ 0x5bf03635) % 1000) < 380;
      }
      return false;
    }

    // ---------- WALL COLLISION ----------
    // Returns true if world position (wx, wz) is inside a wall cell.
    function isPositionInWall(wx, wz) {
      const cx = Math.round(wx / CELL_SIZE);
      const cz = Math.round(wz / CELL_SIZE);
      return isWallAt(cx, cz);
    }

    // Resolve movement: slide along walls instead of stopping dead.
    // Tries full move, then axis-separated moves.
    function resolveMove(px, pz, dx, dz) {
      const r = PLAYER_RADIUS;

      // Attempt full move
      const nx = px + dx;
      const nz = pz + dz;

      // Check a small set of offset points around the player circle
      function blocked(x, z) {
        // Check corners of a bounding square for robustness
        const offsets = [
          [r, 0], [-r, 0], [0, r], [0, -r],
          [r * 0.7, r * 0.7], [-r * 0.7, r * 0.7],
          [r * 0.7, -r * 0.7], [-r * 0.7, -r * 0.7]
        ];
        for (const [ox, oz] of offsets) {
          if (isPositionInWall(x + ox, z + oz)) return true;
        }
        return false;
      }

      if (!blocked(nx, nz)) {
        return { x: nx, z: nz };
      }

      // Try X only
      if (!blocked(nx, pz)) {
        return { x: nx, z: pz };
      }

      // Try Z only
      if (!blocked(px, nz)) {
        return { x: px, z: nz };
      }

      // Fully blocked
      return { x: px, z: pz };
    }

    // ---------- CHUNKS ----------
    function generateChunk(cellX, cellZ) {
      const key = `${cellX},${cellZ}`;
      if (activeObjects.has(key)) return;

      const wx = cellX * CELL_SIZE;
      const wz = cellZ * CELL_SIZE;
      const isWall = isWallAt(cellX, cellZ);

      const floor = getFloorCeiling(false);
      floor.position.set(wx, 0.01, wz);
      floor.visible = true;

      const ceiling = getFloorCeiling(true);
      ceiling.position.set(wx, WALL_HEIGHT - 0.01, wz);
      ceiling.visible = true;

      const chunk = { cellX, cellZ, floor, ceiling, wall: null, light: null };

      if (isWall) {
        const wall = getWall();
        wall.position.set(wx, WALL_HEIGHT / 2, wz);
        wall.visible = true;
        chunk.wall = wall;
      } else {
        const light = getLight();
        light.position.set(wx, WALL_HEIGHT - 0.15, wz);
        light.visible = true;
        chunk.light = light;
        allLights.push(light);
      }

      activeObjects.set(key, chunk);
    }

    function removeChunk(key) {
      const c = activeObjects.get(key);
      if (!c) return;
      returnObj(floorCeilingPool, c.floor);
      returnObj(floorCeilingPool, c.ceiling);
      if (c.wall) returnObj(wallPool, c.wall);
      if (c.light) {
        const i = allLights.indexOf(c.light);
        if (i !== -1) allLights.splice(i, 1);
        returnObj(lightPool, c.light);
      }
      activeObjects.delete(key);
    }

    function updateChunks(px, pz) {
      const ccx = Math.round(px / CELL_SIZE);
      const ccz = Math.round(pz / CELL_SIZE);
      const rc = Math.ceil(RENDER_DISTANCE / CELL_SIZE) + 1;

      for (let dx = -rc; dx <= rc; dx++) {
        for (let dz = -rc; dz <= rc; dz++) {
          const cx = ccx + dx;
          const cz = ccz + dz;
          if (Math.hypot(cx * CELL_SIZE - px, cz * CELL_SIZE - pz) <= RENDER_DISTANCE) {
            generateChunk(cx, cz);
          }
        }
      }

      const toRemove = [];
      for (const [key, c] of activeObjects) {
        if (Math.hypot(c.cellX * CELL_SIZE - px, c.cellZ * CELL_SIZE - pz) > UNLOAD_DISTANCE) {
          toRemove.push(key);
        }
      }
      toRemove.forEach(k => removeChunk(k));
    }

    // ---------- MOBILE CONTROLS ----------
    const joystickBase = document.getElementById('joystickBase');
    const joystickThumb = document.getElementById('joystickThumb');
    const lookArea = document.getElementById('lookArea');

    let moveDirection = { x: 0, z: 0 };
    let isLocked = false;
    let joystickActive = false;
    let joystickId = null;
    
    let lookId = null;
    let lastLookX = 0;
    let lastLookY = 0;
    
    let euler = new THREE.Euler(0, 0, 0, 'YXZ');
    const PI_2 = Math.PI / 2;

    // Desktop pointer lock fallback
    renderer.domElement.addEventListener('click', () => {
      if (window.innerWidth > 1024 && !isLocked) {
        renderer.domElement.requestPointerLock();
      }
    });

    document.addEventListener('pointerlockchange', () => {
      isLocked = document.pointerLockElement === renderer.domElement;
      if (isLocked) {
        hud.innerHTML = '🎯 MOVING • PRESS ESC TO UNLOCK MOUSE';
      }
    });

    // Desktop mouse look
    document.addEventListener('mousemove', (e) => {
      if (isLocked) {
        euler.setFromQuaternion(camera.quaternion);
        euler.y -= e.movementX * 0.002;
        euler.x -= e.movementY * 0.002;
        euler.x = Math.max(-PI_2, Math.min(PI_2, euler.x));
        camera.quaternion.setFromEuler(euler);
      }
    });

    // Touch joystick
    joystickBase.addEventListener('pointerdown', (e) => {
      joystickActive = true;
      joystickId = e.pointerId;
      joystickBase.setPointerCapture(e.pointerId);
      updateJoystick(e);
    });

    joystickBase.addEventListener('pointermove', (e) => {
      if (joystickActive && e.pointerId === joystickId) {
        updateJoystick(e);
      }
    });

    const resetJoystick = () => {
      joystickActive = false;
      joystickId = null;
      moveDirection.x = 0;
      moveDirection.z = 0;
      joystickThumb.style.transform = 'translate(-50%, -50%)';
    };

    joystickBase.addEventListener('pointerup', resetJoystick);
    joystickBase.addEventListener('pointercancel', resetJoystick);

    function updateJoystick(e) {
      const rect = joystickBase.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      let dx = e.clientX - cx;
      let dy = e.clientY - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const maxDist = rect.width / 2;
      
      if (dist > maxDist) {
        dx = (dx / dist) * maxDist;
        dy = (dy / dist) * maxDist;
      }
      
      joystickThumb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      moveDirection.x = dx / maxDist;
      moveDirection.z = dy / maxDist;
    }

    // Touch look tracking
    lookArea.addEventListener('pointerdown', (e) => {
      lookId = e.pointerId;
      lookArea.setPointerCapture(e.pointerId);
      lastLookX = e.clientX;
      lastLookY = e.clientY;
    });

    lookArea.addEventListener('pointermove', (e) => {
      if (e.pointerId === lookId) {
        const deltaX = e.clientX - lastLookX;
        const deltaY = e.clientY - lastLookY;
        
        lastLookX = e.clientX;
        lastLookY = e.clientY;

        euler.setFromQuaternion(camera.quaternion);
        euler.y -= deltaX * 0.003;
        euler.x -= deltaY * 0.003;
        euler.x = Math.max(-PI_2, Math.min(PI_2, euler.x));
        camera.quaternion.setFromEuler(euler);
      }
    });

    lookArea.addEventListener('pointerup', () => { lookId = null; });
    lookArea.addEventListener('pointercancel', () => { lookId = null; });

    // Keyboard
    const keys = {};
    document.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
    document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    // Initial chunks — make sure spawn isn't inside a wall
    // Find a valid open cell near origin
    let spawnX = 0, spawnZ = 0;
    for (let attempt = 0; attempt < 20; attempt++) {
      if (!isWallAt(Math.round(spawnX / CELL_SIZE), Math.round(spawnZ / CELL_SIZE))) break;
      spawnX += CELL_SIZE;
    }
    camera.position.set(spawnX, 1.6, spawnZ);
    updateChunks(spawnX, spawnZ);

    // ---------- GAME LOOP ----------
    const clock = new THREE.Clock();
    let flickerTimer = 0;
    let lastChunkUpdate = 0;

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.1);

      // Movement input
      let mx = moveDirection.x;
      let mz = moveDirection.z;
      
      if (keys.w || keys.arrowup) mz -= 1;
      if (keys.s || keys.arrowdown) mz += 1;
      if (keys.a || keys.arrowleft) mx -= 1;
      if (keys.d || keys.arrowright) mx += 1;

      if (mx !== 0 || mz !== 0) {
        const len = Math.sqrt(mx * mx + mz * mz);
        if (len > 1) { mx /= len; mz /= len; }
        
        const speed = 4.5 * dt;
        const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        
        forward.y = 0; right.y = 0;
        forward.normalize(); right.normalize();

        // Desired displacement
        const ddx = (forward.x * -mz + right.x * mx) * speed;
        const ddz = (forward.z * -mz + right.z * mx) * speed;

        // Resolve with wall collision
        const resolved = resolveMove(camera.position.x, camera.position.z, ddx, ddz);
        camera.position.x = resolved.x;
        camera.position.z = resolved.z;
        
        camera.position.y = 1.6 + Math.sin(Date.now() * 0.01) * 0.02;
      } else {
        camera.position.y += (1.6 - camera.position.y) * 0.1;
      }

      // Chunk update (throttled)
      const now = performance.now();
      if (now - lastChunkUpdate > 400) {
        updateChunks(camera.position.x, camera.position.z);
        lastChunkUpdate = now;
      }

      // Light flicker
      flickerTimer -= dt;
      if (flickerTimer <= 0 && allLights.length > 0) {
        const light = allLights[Math.floor(Math.random() * allLights.length)];
        if (light.material) {
          light.material.color.setHex(0x888844);
          setTimeout(() => {
            if (light.material) light.material.color.setHex(0xffffaa);
          }, 80);
        }
        flickerTimer = 0.2 + Math.random() * 0.4;
      }

      renderer.render(scene, camera);
    }

    animate();

    // Resize handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Prevent zoom gestures
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());
    document.addEventListener('gestureend', e => e.preventDefault());

    console.log('📱 Backrooms: fullscreen + wall collision active');
  </script>
</body>
</html>
