<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Advitya Island - Endless Ocean</title>
    <style>
        :root { --bg: #1a1a2e; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh; width: 100vw;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none; user-select: none;
            touch-action: none;
        }
        canvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
        #vignette {
            position: fixed; inset: 0; pointer-events: none; z-index: 5;
            background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.35) 100%);
        }
        #crosshair {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 6px; height: 6px; border-radius: 50%;
            background: rgba(255,255,255,0.7); box-shadow: 0 0 6px rgba(0,0,0,0.5);
            pointer-events: none; z-index: 8; transition: opacity 0.3s ease;
        }
        #overlay {
            position: fixed; inset: 0; z-index: 20;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(10,10,20,0.55); backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            cursor: pointer; transition: opacity 0.5s ease; pointer-events: auto;
        }
        #overlay.hidden { opacity: 0; pointer-events: none; }
        #overlay .prompt { text-align: center; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,0.6); }
        #overlay .prompt h2 { font-size: 2rem; font-weight: 500; letter-spacing: 0.03em; margin-bottom: 0.35rem; }
        #overlay .prompt .icon { font-size: 3.5rem; display: block; margin-bottom: 0.5rem; animation: float 2.5s ease-in-out infinite; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        #overlay .prompt .keys { font-size: 0.85rem; letter-spacing: 0.05em; color: rgba(255,255,255,0.8); margin-top: 0.6rem; line-height: 1.7; }
        #overlay .prompt .keys span {
            display: inline-block; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
            border-radius: 4px; padding: 0.15rem 0.45rem; margin: 0 0.1rem;
            font-weight: 600; letter-spacing: 0.02em; font-size: 0.8rem;
        }
        #info-hint {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.6); font-size: 13px; letter-spacing: 0.04em;
            pointer-events: none; z-index: 7; text-align: center;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5); transition: opacity 2s ease;
        }
        /* Mobile touch controls */
        #mobile-controls {
            position: fixed; inset: 0; z-index: 30; pointer-events: none;
            display: none;
        }
        .joystick-zone {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.25);
            pointer-events: auto;
            touch-action: none;
        }
        #move-joystick {
            width: 120px; height: 120px; bottom: 40px; left: 40px;
        }
        .joystick-thumb {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 45px; height: 45px; border-radius: 50%;
            background: rgba(255,255,255,0.3);
            border: 2px solid rgba(255,255,255,0.5);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="vignette"></div>
    <div id="crosshair"></div>
    <div id="overlay">
        <div class="prompt">
            <span class="icon">🏝️</span>
            <h2>Click to Explore Advitya Island</h2>
            <div class="keys">
                <span>W</span><span>A</span><span>S</span><span>D</span> Move &nbsp;|&nbsp;
                <span>Mouse</span> Look &nbsp;|&nbsp;
                <span>Space</span> Jump &nbsp;|&nbsp;
                <span>Shift</span> Sprint
            </div>
            <div style="margin-top:0.5rem;font-size:0.75rem;opacity:0.7;">Press <span>Esc</span> to pause</div>
        </div>
    </div>
    <div id="info-hint">Advitya Island • Endless ocean • 125 palms • 60 cabanas</div>

    <!-- Only one joystick for movement (swipe elsewhere to look) -->
    <div id="mobile-controls">
        <div id="move-joystick" class="joystick-zone">
            <div class="joystick-thumb" id="move-thumb"></div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // ─────────────────────────────────────
        // DOM & mobile detection
        // ─────────────────────────────────────
        const overlay = document.getElementById('overlay');
        const crosshair = document.getElementById('crosshair');
        const infoHint = document.getElementById('info-hint');
        const mobileControls = document.getElementById('mobile-controls');

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
            ('ontouchstart' in window && window.innerWidth < 1024);

        // ─────────────────────────────────────
        // Scene setup
        // ─────────────────────────────────────
        const scene = new THREE.Scene();
        const fogColor = new THREE.Color('#c8ddf0');
        scene.fog = new THREE.Fog(fogColor, 80, 220);
        scene.background = new THREE.Color('#b8d4f0');

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.05;
        document.body.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.15, 250);

        // Lighting
        const ambientLight = new THREE.AmbientLight('#8db8e0', 0.85);
        scene.add(ambientLight);
        const hemiLight = new THREE.HemisphereLight('#b1d4f2', '#d4b87a', 0.5);
        scene.add(hemiLight);
        const sunDirection = new THREE.Vector3(18, 22, -8).normalize();
        const sunLight = new THREE.DirectionalLight('#fff8e8', 4.2);
        sunLight.position.copy(sunDirection.clone().multiplyScalar(80));
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 1;
        sunLight.shadow.camera.far = 200;
        sunLight.shadow.camera.left = -60;
        sunLight.shadow.camera.right = 60;
        sunLight.shadow.camera.top = 60;
        sunLight.shadow.camera.bottom = -60;
        sunLight.shadow.bias = -0.00012;
        sunLight.shadow.normalBias = 0.02;
        scene.add(sunLight);

        // Sky dome
        const skyGeometry = new THREE.SphereGeometry(180, 64, 48);
        const skyMaterial = new THREE.ShaderMaterial({
            side: THREE.BackSide,
            uniforms: {
                topColor: { value: new THREE.Color('#3a7bd5') },
                horizonColor: { value: new THREE.Color('#d0e4f7') },
                sunDirection: { value: sunDirection.clone() },
            },
            vertexShader: `varying vec3 vWorldPos;
                void main() {
                    vec4 worldPos = modelMatrix * vec4(position, 1.0);
                    vWorldPos = worldPos.xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }`,
            fragmentShader: `varying vec3 vWorldPos;
                uniform vec3 topColor;
                uniform vec3 horizonColor;
                uniform vec3 sunDirection;
                void main() {
                    float h = normalize(vWorldPos).y;
                    float t = smoothstep(-0.05, 0.55, h);
                    vec3 skyColor = mix(horizonColor, topColor, t);
                    float sunDot = dot(normalize(vWorldPos), sunDirection);
                    float sunGlow = smoothstep(0.92, 0.998, sunDot);
                    skyColor = mix(skyColor, vec3(1.0, 0.96, 0.82), sunGlow * 0.5);
                    float horizonGlow = (1.0 - abs(h)) * 0.06;
                    skyColor += horizonGlow * vec3(0.95, 0.9, 0.8);
                    gl_FragColor = vec4(skyColor, 1.0);
                }`,
        });
        const skyDome = new THREE.Mesh(skyGeometry, skyMaterial);
        skyDome.renderOrder = -10;
        skyDome.material.depthWrite = false;
        scene.add(skyDome);

        const sunPosition = sunDirection.clone().multiplyScalar(100);
        const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(2.0, 32, 32), new THREE.MeshBasicMaterial({ color: '#fffef5' }));
        sunMesh.position.copy(sunPosition);
        sunMesh.renderOrder = -5;
        scene.add(sunMesh);
        const sunGlow = new THREE.Mesh(new THREE.SphereGeometry(4.2, 32, 32),
            new THREE.ShaderMaterial({
                vertexShader: `varying vec3 vNormal; varying vec3 vPosition;
                    void main(){vec4 wp=modelMatrix*vec4(position,1.0);vPosition=wp.xyz;vNormal=normalize(mat3(modelMatrix)*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
                fragmentShader: `varying vec3 vNormal; varying vec3 vPosition;
                    void main(){vec3 viewDir=normalize(vPosition-cameraPosition);float rim=1.0-abs(dot(vNormal,viewDir));float alpha=pow(rim,3.5)*0.35;gl_FragColor=vec4(1.0,0.95,0.7,alpha);}`,
                transparent: true, depthWrite: false,
            })
        );
        sunGlow.position.copy(sunPosition);
        sunGlow.renderOrder = -4;
        scene.add(sunGlow);

        // Endless ocean
        const waterSize = 900;
        const waterSegments = 120;
        const waterGeometry = new THREE.PlaneGeometry(waterSize, waterSize, waterSegments, waterSegments);
        waterGeometry.rotateX(-Math.PI / 2);
        const waterPositions = waterGeometry.attributes.position;
        const waterBaseY = new Float32Array(waterPositions.count);
        const waterX = new Float32Array(waterPositions.count);
        const waterZ = new Float32Array(waterPositions.count);
        for (let i = 0; i < waterPositions.count; i++) {
            waterX[i] = waterPositions.getX(i);
            waterZ[i] = waterPositions.getZ(i);
            waterBaseY[i] = waterPositions.getY(i);
        }
        const waterMaterial = new THREE.MeshStandardMaterial({ color: '#1a7a90', roughness: 0.22, metalness: 0.08 });
        const waterPlane = new THREE.Mesh(waterGeometry, waterMaterial);
        waterPlane.position.y = -0.04;
        waterPlane.receiveShadow = true;
        waterPlane.renderOrder = 1;
        scene.add(waterPlane);

        // Island
        const islandRadius = 85.0;
        const islandScaleY = 0.09;
        const islandSphereGeom = new THREE.SphereGeometry(islandRadius, 128, 96);
        function surfaceNoise(x, z) {
            return (Math.sin(x*1.7+z*0.35)*Math.cos(z*1.9+x*0.45)*0.5 +
                    Math.sin(x*3.1-z*2.3)*Math.cos(z*2.7+x*1.8)*0.3 +
                    Math.sin(x*5.7+z*4.1)*0.2 +
                    Math.cos(x*2.3-z*3.7)*Math.sin(z*4.5+x*0.9)*0.25);
        }
        const islandPositions = islandSphereGeom.attributes.position;
        for (let i = 0; i < islandPositions.count; i++) {
            const x = islandPositions.getX(i);
            const y = islandPositions.getY(i);
            const z = islandPositions.getZ(i);
            let newY = y * islandScaleY;
            if (newY > -0.08) {
                const noiseVal = surfaceNoise(x, z);
                const influence = THREE.MathUtils.smoothstep(newY, -0.08, 0.55);
                newY += noiseVal * 0.13 * influence;
            }
            islandPositions.setY(i, newY);
        }
        islandSphereGeom.computeVertexNormals();
        const islandMaterial = new THREE.MeshStandardMaterial({ color: '#e8c478', roughness: 0.82 });
        const island = new THREE.Mesh(islandSphereGeom, islandMaterial);
        island.position.y = 0.0;
        island.castShadow = island.receiveShadow = true;
        island.renderOrder = 2;
        scene.add(island);

        const wetRing = new THREE.Mesh(new THREE.TorusGeometry(islandRadius-0.15,0.5,16,120),
            new THREE.MeshStandardMaterial({color:'#c49a48',roughness:0.7}));
        wetRing.rotation.x = Math.PI/2; wetRing.position.y=0.02; wetRing.receiveShadow=true; wetRing.renderOrder=3;
        scene.add(wetRing);
        const shallowRing = new THREE.Mesh(new THREE.TorusGeometry(islandRadius+0.7,1.0,12,100),
            new THREE.MeshStandardMaterial({color:'#3aadb8',roughness:0.25,metalness:0.05,transparent:true,opacity:0.5}));
        shallowRing.rotation.x=Math.PI/2; shallowRing.position.y=-0.05; shallowRing.renderOrder=0;
        scene.add(shallowRing);
        const oceanFloor = new THREE.Mesh(new THREE.PlaneGeometry(waterSize,waterSize).rotateX(-Math.PI/2),
            new THREE.MeshStandardMaterial({color:'#8ab4a0',roughness:0.9}));
        oceanFloor.position.y=-3.0; oceanFloor.receiveShadow=true; oceanFloor.renderOrder=-1;
        scene.add(oceanFloor);

        const particlesGeom = new THREE.BufferGeometry();
        const particlePositionsArr = new Float32Array(300*3);
        for (let i=0;i<300;i++) {
            const angle=Math.random()*Math.PI*2, dist=islandRadius+0.5+Math.random()*7;
            particlePositionsArr[i*3]=Math.cos(angle)*dist;
            particlePositionsArr[i*3+1]=0.15+Math.random()*1.8;
            particlePositionsArr[i*3+2]=Math.sin(angle)*dist;
        }
        particlesGeom.setAttribute('position',new THREE.BufferAttribute(particlePositionsArr,3));
        const particles = new THREE.Points(particlesGeom, new THREE.PointsMaterial({color:'#ffffff',size:0.15,transparent:true,opacity:0.35,depthWrite:false,blending:THREE.NormalBlending}));
        particles.renderOrder=4; scene.add(particles);

        // Ground height
        function getGroundHeight(x, z) {
            const dist = Math.sqrt(x*x+z*z);
            if (dist >= islandRadius) return Math.max(-0.3, -(dist-islandRadius)*0.21);
            const sphereY = Math.sqrt(Math.max(0, islandRadius*islandRadius - x*x - z*z));
            let y = sphereY * islandScaleY;
            if (y > -0.08) {
                const noiseVal = surfaceNoise(x, z);
                y += noiseVal * 0.13 * THREE.MathUtils.smoothstep(y, -0.08, 0.55);
            }
            return y;
        }

        // Collision list
        const collidables = [];

        // Clear path corridor (x between -5 and 5, z between 0 and 22)
        function isInClearPath(x, z) {
            return Math.abs(x) < 5 && z > 0 && z < 22;
        }

        // Palm tree
        function createPalmTree() {
            const g = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.22,2.2,8), new THREE.MeshStandardMaterial({color:'#8b5e3c',roughness:0.7}));
            trunk.position.y=1.1; trunk.castShadow=trunk.receiveShadow=true; g.add(trunk);
            const leafMat = new THREE.MeshStandardMaterial({color:'#3a7d34',roughness:0.6});
            for(let i=0;i<5;i++) {
                const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.55,1.8,6), leafMat);
                leaf.position.y=2.1; leaf.rotation.z=Math.PI*0.35; leaf.rotation.y=(i/5)*Math.PI*2+Math.random()*0.5;
                leaf.castShadow=leaf.receiveShadow=true; g.add(leaf);
            }
            const top = new THREE.Mesh(new THREE.SphereGeometry(0.2,8), new THREE.MeshStandardMaterial({color:'#6b8c42'}));
            top.position.y=2.5; top.castShadow=true; g.add(top);
            return g;
        }

        // Cabana (larger, furnished)
        function createCabana() {
            const g = new THREE.Group();
            const size=2.8, half=size/2, postH=2.3;
            const postGeo = new THREE.CylinderGeometry(0.1,0.1,postH,6);
            const postMat = new THREE.MeshStandardMaterial({color:'#a0724a',roughness:0.8});
            [[-half,0,-half],[half,0,-half],[-half,0,half],[half,0,half]].forEach(([x,y,z])=>{
                const p = new THREE.Mesh(postGeo,postMat);
                p.position.set(x,postH/2,z); p.castShadow=p.receiveShadow=true; g.add(p);
            });
            const roof = new THREE.Mesh(new THREE.BoxGeometry(size+0.3,0.2,size+0.3), new THREE.MeshStandardMaterial({color:'#d4b87a',roughness:0.9}));
            roof.position.y=postH; roof.castShadow=roof.receiveShadow=true; g.add(roof);
            const floor = new THREE.Mesh(new THREE.CylinderGeometry(half+0.1,half+0.1,0.05,4), new THREE.MeshStandardMaterial({color:'#c49a48',roughness:0.9}));
            floor.position.y=0.03; floor.receiveShadow=true; g.add(floor);
            const bed = new THREE.Mesh(new THREE.BoxGeometry(2.0,0.3,0.9), new THREE.MeshStandardMaterial({color:'#8b5e3c',roughness:0.8}));
            bed.position.set(-0.5,0.18,half-0.5); bed.castShadow=bed.receiveShadow=true; g.add(bed);
            const tableMat = new THREE.MeshStandardMaterial({color:'#d2b48c',roughness:0.7});
            const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.7,6), tableMat);
            leg.position.set(0.5,0.35,0.3); leg.castShadow=leg.receiveShadow=true; g.add(leg);
            const topT = new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.05,8), tableMat);
            topT.position.set(0.5,0.7,0.3); topT.castShadow=topT.receiveShadow=true; g.add(topT);
            const chairMat = new THREE.MeshStandardMaterial({color:'#a0522d',roughness:0.9});
            const c1 = new THREE.Mesh(new THREE.BoxGeometry(0.35,0.35,0.35), chairMat);
            c1.position.set(0.2,0.18,-0.1); c1.castShadow=c1.receiveShadow=true; g.add(c1);
            const c2 = new THREE.Mesh(new THREE.BoxGeometry(0.35,0.35,0.35), chairMat);
            c2.position.set(0.8,0.18,0.6); c2.castShadow=c2.receiveShadow=true; g.add(c2);
            return g;
        }

        // Place trees and cabanas, avoiding clear path
        const minR=4.5, maxR=islandRadius-1.5;
        for(let i=0;i<125;i++) {
            let x,z;
            do {
                const angle=Math.random()*Math.PI*2;
                const r=minR+Math.random()*(maxR-minR);
                x=Math.cos(angle)*r; z=Math.sin(angle)*r;
            } while(isInClearPath(x,z));
            const gY=getGroundHeight(x,z);
            const tree=createPalmTree();
            tree.position.set(x,gY,z); tree.rotation.y=Math.random()*Math.PI*2;
            scene.add(tree);
            collidables.push({position:new THREE.Vector3(x,gY,z),radius:0.4});
        }
        for(let i=0;i<60;i++) {
            let x,z;
            do {
                const angle=Math.random()*Math.PI*2;
                const r=minR+Math.random()*(maxR-minR);
                x=Math.cos(angle)*r; z=Math.sin(angle)*r;
            } while(isInClearPath(x,z));
            const gY=getGroundHeight(x,z);
            const cabana=createCabana();
            cabana.position.set(x,gY,z); cabana.rotation.y=Math.random()*Math.PI*2;
            scene.add(cabana);
            collidables.push({position:new THREE.Vector3(x,gY,z),radius:1.5});
        }

        // Central house
        const houseSize=5.0, houseHeight=4.8;
        const centerGroundY = getGroundHeight(0,0);
        const houseGroup = new THREE.Group();
        houseGroup.position.set(0,centerGroundY,0);
        const stripeShader = new THREE.ShaderMaterial({
            uniforms: { stripeHeight:{value:0.6}, color1:{value:new THREE.Color('#e63946')}, color2:{value:new THREE.Color('#f1faee')} },
            vertexShader: `varying vec3 vWorldPos; void main(){ vec4 wp=modelMatrix*vec4(position,1.0); vWorldPos=wp.xyz; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
            fragmentShader: `varying vec3 vWorldPos; uniform float stripeHeight; uniform vec3 color1,color2; void main(){ float stripe=step(0.5,fract(vWorldPos.y/stripeHeight)); gl_FragColor=vec4(mix(color1,color2,stripe),1.0); }`
        });
        const houseCube = new THREE.Mesh(new THREE.BoxGeometry(houseSize,houseHeight,houseSize), stripeShader);
        houseCube.position.y=houseHeight/2; houseCube.castShadow=houseCube.receiveShadow=true;
        houseGroup.add(houseCube);
        const doorPlane = new THREE.Mesh(new THREE.PlaneGeometry(1.8,3.6), new THREE.MeshStandardMaterial({color:'#3e2723',roughness:0.8}));
        doorPlane.position.set(0,1.8,houseSize/2+0.02); doorPlane.castShadow=doorPlane.receiveShadow=true;
        houseGroup.add(doorPlane);
        scene.add(houseGroup);

        // Welcome sign
        function createWelcomeSign(groundY) {
            const signGroup = new THREE.Group();
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.12,1.6,8), new THREE.MeshStandardMaterial({color:'#8b5e3c',roughness:0.8}));
            pole.position.y=0.8; pole.castShadow=pole.receiveShadow=true; signGroup.add(pole);
            const canvas = document.createElement('canvas');
            canvas.width=512; canvas.height=256;
            const ctx=canvas.getContext('2d');
            ctx.fillStyle='#f5deb3'; ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle='#3e2723';
            ctx.font='bold 44px "Segoe UI", sans-serif'; ctx.textAlign='center';
            ctx.fillText('Welcome to', canvas.width/2, 80);
            ctx.fillText('Advitya Island', canvas.width/2, 140);
            ctx.font='30px "Segoe UI", sans-serif';
            ctx.fillText('Go straight ahead', canvas.width/2, 205);
            const texture = new THREE.CanvasTexture(canvas);
            const board = new THREE.Mesh(
                new THREE.PlaneGeometry(2.0,1.2),
                new THREE.MeshBasicMaterial({map:texture, side:THREE.DoubleSide})
            );
            board.position.y=2.2;
            signGroup.add(board);
            signGroup.position.set(0, groundY, 18);
            scene.add(signGroup);
            collidables.push({position:new THREE.Vector3(0,groundY,18), radius:0.5});
        }

        // Player spawn
        const spawnX=0, spawnZ=20;
        const spawnGroundY = getGroundHeight(spawnX, spawnZ);
        camera.position.set(spawnX, spawnGroundY+1.6, spawnZ);
        camera.lookAt(0, centerGroundY, 0);
        createWelcomeSign(spawnGroundY);

        let playerVerticalVelocity=0, playerYOffset=0, isOnGround=true, bobPhase=0;

        // PointerLockControls (desktop) or manual camera rotation (mobile)
        let pointerControls;
        if (!isMobile) {
            pointerControls = new PointerLockControls(camera, renderer.domElement);
        }

        const keys = { w:false, a:false, s:false, d:false, space:false, shift:false };
        window.addEventListener('keydown', (e) => {
            const key=e.key.toLowerCase();
            if (key in keys) { keys[key]=true; e.preventDefault(); }
            if (e.code==='Space') { keys.space=true; e.preventDefault(); }
        });
        window.addEventListener('keyup', (e) => {
            const key=e.key.toLowerCase();
            if (key in keys) { keys[key]=false; e.preventDefault(); }
            if (e.code==='Space') { keys.space=false; e.preventDefault(); }
        });

        if (!isMobile) {
            pointerControls.addEventListener('lock', () => {
                overlay.classList.add('hidden');
                crosshair.style.opacity='1';
            });
            pointerControls.addEventListener('unlock', () => {
                overlay.classList.remove('hidden');
                crosshair.style.opacity='0.4';
                for(const k in keys) keys[k]=false;
                playerVerticalVelocity=0; playerYOffset=0; isOnGround=true;
            });
            overlay.addEventListener('click', () => pointerControls.lock());
            renderer.domElement.addEventListener('click', (e) => {
                if (!pointerControls.isLocked) pointerControls.lock();
            });
        } else {
            // Mobile: hide overlay, crosshair, show single joystick + swipe look
            overlay.style.display = 'none';
            crosshair.style.display = 'none';
            mobileControls.style.display = 'block';
            setupMobileControls();
        }

        function setupMobileControls() {
            const moveZone = document.getElementById('move-joystick');
            const moveThumb = document.getElementById('move-thumb');

            let moveActive = false, moveId = null;
            let moveCenter = {x:0,y:0};
            const maxDist = 50;

            function updateMoveThumb(dx,dy) {
                const dist = Math.sqrt(dx*dx+dy*dy);
                const clamped = Math.min(dist, maxDist);
                const angle = Math.atan2(dy,dx);
                const tx = Math.cos(angle)*clamped, ty = Math.sin(angle)*clamped;
                moveThumb.style.transform = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px))`;
                if (dist > 10) {
                    keys.w = ty < -10;
                    keys.s = ty > 10;
                    keys.a = tx < -10;
                    keys.d = tx > 10;
                } else {
                    keys.w=keys.a=keys.s=keys.d=false;
                }
            }

            moveZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const t = e.touches[0];
                moveActive = true; moveId = t.identifier;
                const rect = moveZone.getBoundingClientRect();
                moveCenter = {x: rect.left+rect.width/2, y: rect.top+rect.height/2};
                updateMoveThumb(t.clientX-moveCenter.x, t.clientY-moveCenter.y);
            });
            moveZone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for(let i=0;i<e.touches.length;i++) {
                    if(e.touches[i].identifier===moveId) {
                        updateMoveThumb(e.touches[i].clientX-moveCenter.x, e.touches[i].clientY-moveCenter.y);
                    }
                }
            });
            moveZone.addEventListener('touchend', (e) => {
                moveActive=false; moveId=null;
                moveThumb.style.transform = 'translate(-50%,-50%)';
                keys.w=keys.a=keys.s=keys.d=false;
            });

            // ---------- Swipe-to-look (anywhere outside move joystick) ----------
            let lookTouchId = null;
            let lastLookPos = {x:0, y:0};
            const LOOK_SENSITIVITY = 0.005;

            // Store touch data for tap detection (fullscreen)
            const touchData = new Map();

            function isInsideMoveZone(touch) {
                const rect = moveZone.getBoundingClientRect();
                return touch.clientX >= rect.left && touch.clientX <= rect.right &&
                       touch.clientY >= rect.top && touch.clientY <= rect.bottom;
            }

            function handleTouchStart(e) {
                for (const touch of e.changedTouches) {
                    // Record for tap detection
                    touchData.set(touch.identifier, {
                        startX: touch.clientX,
                        startY: touch.clientY,
                        startTime: Date.now()
                    });

                    // If it's inside move zone, it's already handled by the zone listener
                    if (isInsideMoveZone(touch)) continue;

                    // Only allow one look finger at a time
                    if (lookTouchId === null) {
                        lookTouchId = touch.identifier;
                        lastLookPos = {x: touch.clientX, y: touch.clientY};
                        e.preventDefault(); // claim the touch for look
                    }
                }
            }

            function handleTouchMove(e) {
                for (const touch of e.changedTouches) {
                    if (touch.identifier === lookTouchId) {
                        const dx = touch.clientX - lastLookPos.x;
                        const dy = touch.clientY - lastLookPos.y;
                        camera.rotation.y -= dx * LOOK_SENSITIVITY;
                        // FIXED: swipe up (dy negative) should tilt camera up (decrease rotation.x)
                        camera.rotation.x += dy * LOOK_SENSITIVITY;
                        camera.rotation.x = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, camera.rotation.x));
                        lastLookPos = {x: touch.clientX, y: touch.clientY};
                        e.preventDefault();
                    }
                }
            }

            function handleTouchEnd(e) {
                for (const touch of e.changedTouches) {
                    // Fullscreen on tap (short, almost no movement)
                    const data = touchData.get(touch.identifier);
                    if (data) {
                        const dx = touch.clientX - data.startX;
                        const dy = touch.clientY - data.startY;
                        const dist = Math.hypot(dx, dy);
                        const duration = Date.now() - data.startTime;
                        if (dist < 10 && duration < 300 && !document.fullscreenElement) {
                            document.body.requestFullscreen().catch(() => {});
                        }
                        touchData.delete(touch.identifier);
                    }

                    // End look gesture
                    if (touch.identifier === lookTouchId) {
                        lookTouchId = null;
                    }
                }
            }

            function handleTouchCancel(e) {
                for (const touch of e.changedTouches) {
                    touchData.delete(touch.identifier);
                    if (touch.identifier === lookTouchId) {
                        lookTouchId = null;
                    }
                }
            }

            // Attach swipe/tap listeners (but not on moveZone, because its listeners use stopPropagation? We use document level)
            document.addEventListener('touchstart', handleTouchStart, {passive: false});
            document.addEventListener('touchmove', handleTouchMove, {passive: false});
            document.addEventListener('touchend', handleTouchEnd);
            document.addEventListener('touchcancel', handleTouchCancel);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();
        let elapsedTotal=0;

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(),0.15);
            elapsedTotal += dt;

            const speed = keys.shift ? 14.0 : 8.0;
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            forward.y=0; if(forward.length()>0.001) forward.normalize(); else forward.set(0,0,-1);
            const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0,1,0)).normalize();

            let moveX=0, moveZ=0;
            if(keys.w){ moveX+=forward.x; moveZ+=forward.z; }
            if(keys.s){ moveX-=forward.x; moveZ-=forward.z; }
            if(keys.a){ moveX-=right.x; moveZ-=right.z; }
            if(keys.d){ moveX+=right.x; moveZ+=right.z; }
            const moveMag = Math.sqrt(moveX*moveX+moveZ*moveZ);
            let newX=camera.position.x, newZ=camera.position.z;
            if(moveMag>0.01) {
                const amt = speed * Math.min(moveMag,1.0) * dt;
                newX += (moveX/moveMag)*amt;
                newZ += (moveZ/moveMag)*amt;
            }

            const dist = Math.sqrt(newX*newX+newZ*newZ);
            if(dist > islandRadius-1.0) { const s = (islandRadius-1.0)/dist; newX*=s; newZ*=s; }

            const houseHalf = houseSize/2;
            if(Math.abs(newX)<houseHalf && Math.abs(newZ)<houseHalf && camera.position.y<centerGroundY+houseHeight+0.3) {
                const len = Math.sqrt(newX*newX+newZ*newZ)||0.01;
                newX = (newX/len)*(houseHalf+0.15);
                newZ = (newZ/len)*(houseHalf+0.15);
            }

            for(const obj of collidables) {
                const dx = newX-obj.position.x, dz = newZ-obj.position.z;
                const d = Math.sqrt(dx*dx+dz*dz);
                const minDist = obj.radius+0.3;
                if(d<minDist) {
                    const ang = Math.atan2(dz,dx);
                    newX = obj.position.x + Math.cos(ang)*minDist;
                    newZ = obj.position.z + Math.sin(ang)*minDist;
                }
            }

            const groundY = getGroundHeight(newX,newZ);
            if(keys.space && isOnGround) { playerVerticalVelocity=5.5; isOnGround=false; keys.space=false; }
            if(!isOnGround) {
                playerVerticalVelocity += -16.0*dt;
                playerYOffset += playerVerticalVelocity*dt;
                if(playerYOffset<=0) { playerYOffset=0; playerVerticalVelocity=0; isOnGround=true; }
            }
            let bob=0;
            if(moveMag>0.01 && isOnGround) {
                const freq = keys.shift?10.5:8.0, amp = keys.shift?0.06:0.04;
                bobPhase += dt*freq*(speed/8.0);
                bob = Math.sin(bobPhase)*amp;
            } else bobPhase*=0.9;
            camera.position.set(newX, Math.max(groundY+1.6+playerYOffset+bob,0.2), newZ);

            // Water animation
            const posArr = waterGeometry.attributes.position.array;
            for(let i=0;i<waterPositions.count;i++) {
                const x=waterX[i], z=waterZ[i], idx=i*3;
                const wave = Math.sin(x*0.25+elapsedTotal*0.6)*Math.cos(z*0.2+elapsedTotal*0.45)*0.3 +
                    Math.sin(z*0.35+elapsedTotal*0.75)*0.2 +
                    Math.sin((x+z)*0.22+elapsedTotal*0.5)*Math.cos((x-z)*0.28+elapsedTotal*0.6)*0.25;
                const fade = THREE.MathUtils.smoothstep(Math.sqrt(x*x+z*z), islandRadius-1.5, islandRadius+3);
                posArr[idx+1] = waterBaseY[i] + wave*fade;
            }
            waterGeometry.attributes.position.needsUpdate=true;
            waterGeometry.computeVertexNormals();

            const pArr = particlesGeom.attributes.position.array;
            for(let i=0;i<300;i++) {
                pArr[i*3+1] += Math.sin(elapsedTotal*2.5+i)*0.004;
                if(pArr[i*3+1]>2.2) pArr[i*3+1]=0.15;
            }
            particlesGeom.attributes.position.needsUpdate=true;
            sunGlow.scale.setScalar(1+Math.sin(elapsedTotal*0.4)*0.04);
            renderer.render(scene, camera);
        }

        animate();
        console.log('🏝️ Advitya Island ready — mobile: joystick move + swipe look + tap fullscreen.');
    </script>
</body>
</html>
